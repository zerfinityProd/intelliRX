name: Angular Build + Deploy

on:
  push:
    branches: [ beta0.2 ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build -- --configuration production --base-href "/"

      - name: Debug dist
        run: |
          echo "==== DIST STRUCTURE ===="
          ls -R dist

      - name: Prepare for Pages
  run: |
    # Find actual output folder
    BUILD_DIR=$(find dist -name index.html -exec dirname {} \; | head -n 1)
    
    if [ -z "$BUILD_DIR" ]; then
      echo "Error: Could not find index.html in dist directory"
      ls -R dist
      exit 1
    fi
    
    echo "Build directory is: $BUILD_DIR"
    
    # Verify the directory exists and contains files
    if [ ! -d "$BUILD_DIR" ]; then
      echo "Error: Build directory does not exist"
      exit 1
    fi
    
    cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
    touch "$BUILD_DIR/.nojekyll"
    
    echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV
    
    # Debug: List contents of the directory being uploaded
    echo "Contents of $BUILD_DIR:"
    ls -la "$BUILD_DIR"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://intellirx.zerfinity.com/
    steps:
      - uses: actions/deploy-pages@v4
