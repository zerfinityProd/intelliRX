<div class="skeleton-widget-container" #widgetContainer (mouseleave)="hideTooltip()">
  
  <!-- ── HEADER ── -->
  <div class="skeleton-widget-header">
    <div class="header-left">
      <!-- Toggle Views -->
      <div class="view-pill-group">
        <button type="button" class="view-toggle-btn" [class.active]="currentView === 'anterior'" (click)="setView('anterior')">
          Anterior
        </button>
        <button type="button" class="view-toggle-btn" [class.active]="currentView === 'posterior'" (click)="setView('posterior')">
          Posterior
        </button>
      </div>
    </div>

    <!-- Controls -->
    <div class="header-right">
      <!-- Counter -->
      <div class="selection-counter">
        <span class="badge">{{ selectedMuscleIds.length }}</span>
        <span class="counter-label">selected</span>
      </div>

      <!-- Reset -->
      <button type="button" class="clear-btn" [disabled]="selectedMuscleIds.length === 0" (click)="clearSelection()" aria-label="Clear all selections">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="btn-icon">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
        Clear
      </button>
    </div>
  </div>
