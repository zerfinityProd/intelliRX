<div class="skeleton-widget-container" #widgetContainer (mouseleave)="hideTooltip()">
  <div class="skeleton-widget-header">
    <div class="header-left">
      <div class="header-title-row">
        <h3 class="skeleton-widget-title">Human Skeletal System</h3>
        <span class="view-pill" *ngIf="currentView !== 'full'">{{ getViewName() }}</span>
      </div>
      <div class="header-subtitle-row">
        <p class="skeleton-widget-hint" *ngIf="currentView === 'full'">Click highlighted regions (Hands, Feet, Skull, Spine) to zoom in for detailed bone selection.</p>
        <div class="back-navigation" *ngIf="currentView !== 'full'">
          <button class="back-btn" (click)="setView('full')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="btn-icon">
              <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
            Back to Full Body
          </button>
          <span class="hint-separator">·</span>
          <span class="skeleton-widget-hint">Click bones to select</span>
        </div>
      </div>
    </div>
    <div class="header-right" *ngIf="selectedBoneIds.length > 0">
      <div class="selection-counter">
        <span class="badge">{{ selectedBoneIds.length }}</span>
        <span class="counter-label">selected</span>
      </div>
      <button class="clear-btn" (click)="clearSelection()" aria-label="Deselect all bones">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="btn-icon">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
        Deselect All
      </button>
    </div>
  </div>

  <div class="skeleton-viewport">
    
    <!-- ════════ FULL BODY VIEW ════════ -->
    <div class="svg-layer fade-in" *ngIf="currentView === 'full'">
      <svg viewBox="0 0 400 800" class="anatomy-svg full-body-svg">
        
        <!-- Background decorative tech grid -->
        <g class="tech-grid">
          <line x1="200" y1="0" x2="200" y2="800" class="grid-line" />
          <circle cx="200" cy="400" r="150" class="grid-circle" />
          <circle cx="200" cy="400" r="300" class="grid-circle" />
        </g>

        <!-- UPFRONT SKULL (Visible upfront, acts as zoom hotspot) -->
        <g class="hotspot-group" (click)="toggleBone('hotspot_skull')" (mouseenter)="showTooltip($event, 'hotspot_skull')" (mouseleave)="hideTooltip()" (mousemove)="updateTooltipPos($event)">
          <!-- Highlight Area border (dotted) -->
          <path d="M170,40 C160,10 240,10 230,40 C235,55 230,70 200,75 C170,70 165,55 170,40 Z" class="hotspot-area" />
          <!-- Realistic Cranium, cheek flares and chin -->
          <path d="M 180,48 C 176,22 224,22 220,48 C 226,52 223,60 216,63 C 213,72 208,78 200,78 C 192,78 187,72 184,63 C 177,60 174,52 180,48 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" />
          <!-- Eye orbits (realistic quadrangular shapes) -->
          <path d="M 186,44 Q 192,42 196,45 Q 196,51 192,53 Q 186,51 186,44 Z" fill="#475569" />
          <path d="M 204,45 Q 208,42 214,44 Q 214,51 208,53 Q 204,51 204,45 Z" fill="#475569" />
          <!-- Nasal aperture and septum line -->
          <path d="M 197,56 C 197,54 199,52 200,52 C 201,52 203,54 203,56 C 203,60 201,62 200,62 C 199,62 197,60 197,56 Z" fill="#475569" />
          <line x1="200" y1="52" x2="200" y2="62" stroke="#cbd5e1" stroke-width="0.8" />
          <!-- Suture / dental arches lines -->
          <path d="M 191,69 L 209,69" stroke="#475569" stroke-width="1" />
          <line x1="194" y1="66" x2="194" y2="72" stroke="#475569" stroke-width="0.8" />
          <line x1="197" y1="66" x2="197" y2="72" stroke="#475569" stroke-width="0.8" />
          <line x1="200" y1="66" x2="200" y2="72" stroke="#475569" stroke-width="0.8" />
          <line x1="203" y1="66" x2="203" y2="72" stroke="#475569" stroke-width="0.8" />
          <line x1="206" y1="66" x2="206" y2="72" stroke="#475569" stroke-width="0.8" />
          
          <rect x="160" y="5" width="80" height="78" class="hotspot-box" />
          <text x="245" y="40" class="hotspot-label">Skull (22) ↗</text>
