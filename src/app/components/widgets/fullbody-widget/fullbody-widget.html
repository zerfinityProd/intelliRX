<div class="skeleton-widget-container" #widgetContainer (mouseleave)="hideTooltip()">
  <div class="skeleton-widget-header">
    <div class="header-left">
      <div class="header-title-row">
        <span class="view-pill" *ngIf="currentView !== 'full'">{{ getViewName() }}</span>
      </div>
      <div class="header-subtitle-row" *ngIf="currentView !== 'full'">
        <div class="back-navigation">
          <button class="back-btn" (click)="setView('full')">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="btn-icon">
              <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
            Back to Full Body
          </button>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="selection-counter">
        <span class="badge">{{ selectedBoneIds.length }}</span>
        <span class="counter-label">selected</span>
      </div>
      <button class="clear-btn" (click)="clearSelection()" aria-label="Deselect all bones" [disabled]="selectedBoneIds.length === 0">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="btn-icon">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
        Clear
      </button>
    </div>
  </div>

  <div class="skeleton-viewport">
    
    <!-- ════════ FULL BODY VIEW ════════ -->
    <div class="svg-layer fade-in" *ngIf="currentView === 'full'">
      <svg viewBox="0 0 400 800" class="anatomy-svg full-body-svg">
        
        <!-- Background decorative tech grid -->
        <g class="tech-grid">
          <line x1="200" y1="0" x2="200" y2="800" class="grid-line" />
          <circle cx="200" cy="400" r="150" class="grid-circle" />
          <circle cx="200" cy="400" r="300" class="grid-circle" />
        </g>

        <!-- ── SKULL HOTSPOT (compact, refined cranium) ── -->
        <g class="hotspot-group" (click)="toggleBone('hotspot_skull')" (mouseenter)="showTooltip($event, 'hotspot_skull')" (mouseleave)="hideTooltip()" (mousemove)="updateTooltipPos($event)">
          <path d="M176,22 C169,8 231,8 224,22 C231,40 227,58 200,64 C173,58 169,40 176,22 Z" class="hotspot-area" />
          <!-- Refined cranium with natural forehead-to-chin taper -->
          <path d="M186,28 C183,12 217,12 214,28 C219,34 217,48 211,52 C208,58 205,62 200,64 C195,62 192,58 189,52 C183,48 181,34 186,28 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.2" stroke-linejoin="round" />
          <!-- Eye orbits -->
          <path d="M190,36 Q194,34 196,37 Q196,40 193,41 Q190,40 190,36 Z" fill="#475569" />
          <path d="M204,37 Q207,34 210,36 Q210,40 207,41 Q204,40 204,37 Z" fill="#475569" />
          <!-- Nasal aperture -->
          <path d="M198,44 C198,42 200,41 200,41 C200,41 202,42 202,44 C202,47 201,49 200,49 C199,49 198,47 198,44 Z" fill="#475569" />
          <!-- Dental arch hint -->
          <path d="M194,55 L206,55" stroke="#475569" stroke-width="0.8" />
          <line x1="197" y1="53" x2="197" y2="57" stroke="#475569" stroke-width="0.6" />
          <line x1="200" y1="53" x2="200" y2="57" stroke="#475569" stroke-width="0.6" />
          <line x1="203" y1="53" x2="203" y2="57" stroke="#475569" stroke-width="0.6" />
          <rect x="168" y="5" width="64" height="65" class="hotspot-box" />
          <text x="237" y="30" class="hotspot-label">Skull (22) ↗</text>
        </g>

        <!-- ── SPINE HOTSPOT (narrow vertebral column) ── -->
        <g class="hotspot-group" (click)="toggleBone('hotspot_spine')" (mouseenter)="showTooltip($event, 'hotspot_spine')" (mouseleave)="hideTooltip()" (mousemove)="updateTooltipPos($event)">
          <rect x="191" y="68" width="18" height="200" rx="9" class="hotspot-area" />
          <!-- Cervical vertebrae (5 shown) -->
          <rect x="197" y="70" width="6" height="3" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />
          <rect x="197" y="75" width="6" height="3" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />

          <rect x="194" y="117" width="12" height="4" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />
          <rect x="194" y="124" width="12" height="4" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />
          <rect x="193" y="131" width="14" height="4" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />
          <rect x="193" y="138" width="14" height="4" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />
          <rect x="193" y="145" width="14" height="4" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />

          <rect x="190" y="190" width="20" height="5" rx="1.2" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />
          <rect x="190" y="198" width="20" height="5" rx="1.2" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />
          <rect x="189" y="206" width="22" height="5" rx="1.2" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />
          <rect x="189" y="214" width="22" height="5" rx="1.2" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />

          <path d="M197,251 L203,251 L200,262 Z" fill="#cbd5e1" stroke="#475569" stroke-width="0.6" />
          <rect x="189" y="68" width="22" height="200" class="hotspot-box" />
          <text x="218" y="170" class="hotspot-label">Spine (26) ↗</text>
        </g>

          <path d="M234,726 L230,738 L228,747" fill="none" stroke="#475569" stroke-width="1.2" stroke-linecap="round" />
          <text x="274" y="740" class="hotspot-label">Right Foot (26) ↘</text>
        </g>

        <!-- ═══════ SELECTABLE MAJOR BONES ═══════ -->
        
        <!-- Clavicles (thin S-curves from sternum to shoulder tip) -->

        <path d="M197,158 C172,158 148,174 147,185" class="bone-stroke" stroke-width="3.5" [class.selected]="isSelected('rib_left_10')" (click)="toggleBone('rib_left_10')" (mouseenter)="showTooltip($event, 'rib_left_10')" (mouseleave)="hideTooltip()" (mousemove)="updateTooltipPos($event)" />
