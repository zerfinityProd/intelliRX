<div
  class="expiry-banner"
  [ngClass]="urgencyClass"
  role="alert"
  aria-live="polite"
  aria-atomic="true"
>
  <div class="expiry-banner__body">

    <!-- Warning icon -->
    <span class="expiry-banner__icon" aria-hidden="true">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </span>

    <!-- Text content -->
    <span class="expiry-banner__text">
      <strong class="expiry-banner__title">Subscription Expiring</strong>
      <span class="expiry-banner__message">
        Your plan is ending soon. Please make the payment to continue using the application.
        <span *ngIf="daysLabel" class="expiry-banner__days">({{ daysLabel }})</span>
      </span>
    </span>

  </div>

  <!-- Dismiss button -->
  <button
    class="expiry-banner__close"
    type="button"
    aria-label="Dismiss subscription expiry notification"
    (click)="onDismiss()"
  >
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>
