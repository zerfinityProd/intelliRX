<div class="ntf-denied-banner" role="alert" aria-live="polite">
  <div class="ntf-denied-inner">
    <!-- Icon -->
    <span class="ntf-denied-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </span>

    <!-- Text -->
    <div class="ntf-denied-text">
      <strong>Notifications are blocked.</strong>
      To receive real-time alerts, enable them in your browser:
      <!-- Chrome / Edge -->
      <span class="ntf-denied-hint">
        Click the <strong>🔒 lock icon</strong> in the address bar → <em>Site settings</em> → set <em>Notifications</em> to <strong>Allow</strong>.
      </span>
    </div>

    <!-- Dismiss -->
    <button
      id="ntf-denied-dismiss-btn"
      type="button"
      class="ntf-denied-close"
      aria-label="Dismiss notification warning"
      (click)="onDismiss()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</div>
