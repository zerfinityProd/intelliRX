<div class="onboarding-page">
  <div class="container">
    <div class="wizard-card">
      <div class="wizard-header">
        <div class="logo">✨ IntelliRX</div>
        <h2>Setup your first clinic</h2>
        <p>You can always add more clinics and staff later from your dashboard.</p>
      </div>

      <div class="wizard-body">
        <form (submit)="saveClinic($event)">
          <div class="form-group">
            <label>Clinic Name</label>
            <input type="text" [(ngModel)]="clinic.name" name="name" required placeholder="Downtown Clinic">
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" [(ngModel)]="clinic.address" name="address" required placeholder="123 Health Ave, Medical District">
          </div>
          <div class="form-group">
            <label>Phone Number (Optional)</label>
            <input type="text" [(ngModel)]="clinic.phone" name="phone" placeholder="(555) 123-4567">
          </div>
          
          <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

          <button type="submit" class="btn btn-primary btn-full" [disabled]="isSaving">
            {{ isSaving ? 'Saving...' : 'Complete Setup' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
