<div class="leaves-container">
  <div class="header">
    <button class="btn btn-outline" (click)="goBack()">← Back</button>
    <h2>My Leaves</h2>
  </div>

  <div class="content">
    <div class="apply-card card">
      <h3>Apply for Leave</h3>
      <div class="form-group">
        <label>Date</label>
        <input type="date" [(ngModel)]="newLeave.date" [min]="minDate" class="form-control">
      </div>
      <div class="form-group">
        <label>Shift / Timing</label>
        <select [(ngModel)]="newLeave.timing" class="form-control">
          <option value="All Day">All Day</option>
          <option value="FH">First Half (FH)</option>
          <option value="SH">Second Half (SH)</option>
        </select>
      </div>
      <button class="btn btn-primary" (click)="applyLeave()" [disabled]="isSubmitting || !newLeave.date">
        {{ isSubmitting ? 'Submitting...' : 'Apply Leave' }}
      </button>
    </div>

    <div class="history-card card">
      <h3>Leave History</h3>
      <table class="data-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Timing</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let leave of leaves">
            <td>{{ leave.date | date:'mediumDate' }}</td>
            <td>{{ leave.timing }}</td>
            <td><span class="status-badge" [class.approved]="leave.status === 'approved'">{{ leave.status | titlecase }}</span></td>
            <td>
              <button class="btn btn-outline btn-sm text-danger" (click)="cancelLeave(leave.id!)">Cancel</button>
            </td>
          </tr>
          <tr *ngIf="leaves.length === 0">
            <td colspan="4" class="text-center">No leaves found</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
