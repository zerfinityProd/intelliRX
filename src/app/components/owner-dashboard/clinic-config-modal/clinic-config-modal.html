<div class="modal-overlay" *ngIf="show">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Configure {{ clinic?.name }} Timings</h2>
      <button class="btn-close" (click)="close()">×</button>
    </div>

    <div class="modal-body" *ngIf="clinic">
      <div class="form-group">
        <label>Active Days</label>
        <div class="weekdays-selector">
          <label class="checkbox-label" *ngFor="let day of allWeekdays">
            <input type="checkbox" 
                   [checked]="schedule.weekdays.includes(day.value)"
                   (change)="toggleWeekday(day.value, $event)">
            {{ day.label }}
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>First Half (FH) Timings</label>
        <div class="timing-row">
          <input type="time" [(ngModel)]="fhStart" class="form-control">
          <span>to</span>
          <input type="time" [(ngModel)]="fhEnd" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label>Second Half (SH) Timings</label>
        <div class="timing-row">
          <input type="time" [(ngModel)]="shStart" class="form-control">
          <span>to</span>
          <input type="time" [(ngModel)]="shEnd" class="form-control">
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="close()">Cancel</button>
      <button class="btn btn-primary" (click)="save()" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Save Configuration' }}
      </button>
    </div>
  </div>
</div>
