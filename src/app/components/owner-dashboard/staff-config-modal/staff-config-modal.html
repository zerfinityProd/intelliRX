<div class="modal-overlay" *ngIf="show">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Configure {{ staff?.name || 'Staff' }}</h2>
      <button class="btn-close" (click)="close()">×</button>
    </div>

    <div class="modal-body" *ngIf="staff">
      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="status" class="form-control">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>

      <div class="form-group">
        <label>Availability (Overrides Clinic Default)</label>
        <p class="help-text">Select which shifts this staff member works on each day.</p>
        
        <div class="availability-grid">
          <div class="grid-header">
            <div>Day</div>
            <div>First Half (FH)</div>
            <div>Second Half (SH)</div>
          </div>
          <div class="grid-row" *ngFor="let day of allWeekdays">
            <div class="day-label">{{ day.label }}</div>
            <div>
              <input type="checkbox" 
                     [checked]="hasTiming(day.value, 'FH')"
                     (change)="toggleTiming(day.value, 'FH', $event)">
            </div>
            <div>
              <input type="checkbox" 
                     [checked]="hasTiming(day.value, 'SH')"
                     (change)="toggleTiming(day.value, 'SH', $event)">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="close()">Cancel</button>
      <button class="btn btn-primary" (click)="save()" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Save Configuration' }}
      </button>
    </div>
  </div>
</div>
