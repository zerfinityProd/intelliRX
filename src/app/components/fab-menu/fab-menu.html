<!-- ── Floating Action Button Group (left-side, always visible) ── -->
<div class="fab-group" role="region" aria-label="Quick actions">

  <div *ngIf="permissions.canAppointment" class="fab-item">
    <button
      class="fab-btn fab-visit-btn"
      (click)="addAppointmentClicked.emit()"
      aria-label="Book appointment">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </button>
    <span class="fab-tooltip" aria-hidden="true">Appointment</span>
  </div>

  <div *ngIf="permissions.canAddPatient" class="fab-item">
    <button
      class="fab-btn fab-patient-btn"
      (click)="addPatientClicked.emit()"
      aria-label="Add new patient">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <line x1="19" y1="8" x2="19" y2="14"></line>
        <line x1="22" y1="11" x2="16" y2="11"></line>
      </svg>
    </button>
    <span class="fab-tooltip" aria-hidden="true">New Patient</span>
  </div>

</div>
